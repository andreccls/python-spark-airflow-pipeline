# Airflow 2.10 (LocalExecutor) + Postgres. One image, built from docker/Dockerfile.
x-airflow: &airflow
  build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
  image: pspa-pipeline:runtime
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PIPELINE_DATA_DIR: /opt/airflow/data
    PYTHONPATH: /opt/airflow/src:/opt/airflow/dags
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 10 }

  init:
    <<: *airflow
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname a --lastname d
      --role Admin --email admin@example.com || true"
    depends_on: { postgres: { condition: service_healthy } }

  webserver:
    <<: *airflow
    command: webserver
    ports: ["8085:8080"]
    depends_on: { init: { condition: service_completed_successfully } }

  scheduler:
    <<: *airflow
    command: scheduler
    depends_on: { init: { condition: service_completed_successfully } }

volumes:
  pgdata:
